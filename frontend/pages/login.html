<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion · Club photo</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site">
    <a class="brand" href="../index.html">Club photo</a>
    <nav class="main">
      <a href="../index.html">Accueil</a>
      <a href="galeries.html">Galeries</a>
      <a href="concours.html">Concours</a>
      <a href="admin.html">Admin</a>
      <a href="login.html" aria-current="page">Connexion</a>
    </nav>
    <label class="role-switch">Rôle (démo)<select id="role-select"></select></label>
  </header>

  <main>
    <section class="card" style="max-width:380px;margin:0 auto">
      <h1>Connexion</h1>
      <form id="login-form">
        <div class="field"><label for="user">Identifiant</label><input id="user" name="user" type="text" autocomplete="username" required></div>
        <div class="field"><label for="pwd">Mot de passe</label><input id="pwd" name="pwd" type="password" autocomplete="current-password" required></div>
        <button type="submit">Se connecter</button>
        <p id="login-msg" class="muted" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="site">Club photo · Front de démonstration</footer>
  <script src="../js/app.js"></script>
</body>
</html>

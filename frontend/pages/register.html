<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Créer mon compte · Club photo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="register">
  <header class="site">
    <a class="brand" href="/index.html">Club photo</a>
    <nav class="main" id="nav"></nav>
    <span class="role-switch" id="user-status"></span>
  </header>

  <main id="main">
    <section class="card" style="max-width:380px;margin:0 auto">
      <h1>Créer mon compte</h1>
      <p class="muted">Ce compte est créé sur invitation.</p>
      <form id="register-form">
        <div class="field"><label for="reg-user">Identifiant</label><input id="reg-user" name="user" required pattern="[a-zA-Z0-9_.-]{3,32}"></div>
        <div class="field"><label for="reg-name">Nom affiché</label><input id="reg-name" name="displayName"></div>
        <div class="field"><label for="reg-pwd">Mot de passe (8 caractères minimum)</label><input id="reg-pwd" name="pwd" type="password" minlength="8" required></div>
        <button type="submit">Créer le compte</button>
        <p id="register-msg" class="muted" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="site">Club photo</footer>
  <script src="/js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeries · Club photo</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site">
    <a class="brand" href="../index.html">Club photo</a>
    <nav class="main">
      <a href="../index.html">Accueil</a>
      <a href="galeries.html" aria-current="page">Galeries</a>
      <a href="concours.html">Concours</a>
      <a href="admin.html">Admin</a>
      <a href="login.html">Connexion</a>
    </nav>
    <span class="role-switch" id="user-status"></span>
  </header>

  <main>
    <h1>Galeries</h1>
    <p class="muted">Les galeries affichées dépendent de votre rôle.</p>
    <section id="gallery-list"></section>

    <section class="card" id="new-gallery" hidden>
      <h2>Nouvelle galerie</h2>
      <form id="gallery-form">
        <div class="field"><label for="g-title">Titre</label><input id="g-title" name="title" type="text" maxlength="120" required></div>
        <div class="field"><label for="g-visibility">Visibilité</label><select id="g-visibility" name="visibility"></select></div>
        <button type="submit">Créer la galerie</button>
        <p id="gallery-msg" class="muted" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="site">Club photo · Front de démonstration</footer>
  <script src="../js/app.js"></script>
</body>
</html>

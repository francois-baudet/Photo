# Déploiement : voir DEPLOIEMENT.md
# Les valeurs sensibles viennent du fichier .env à la racine (voir .env.example).
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: photo
      POSTGRES_USER: photo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo -d photo"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Pas de ports publiés : la base n'est joignable que depuis le réseau Docker

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: photo-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://photo:${DB_PASSWORD}@db:5432/photo
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      STORAGE_DIR: /srv/storage
    volumes:
      # Dossier des fichiers RAW, aperçus et miniatures sur l'hôte
      - ${STORAGE_HOST_DIR:-./storage}:/srv/storage
    ports:
      # Lié à localhost : seul le nginx de l'hôte peut atteindre l'API
      - "127.0.0.1:3000:3000"

volumes:
  db_data:
